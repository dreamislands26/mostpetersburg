<!doctype html><html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://mostpetersburg.ru/zh-CN/contact.html"><link rel="stylesheet" href="/styles.css"><style>html[dir=rtl] .hero,html[dir=rtl] section{text-align:right}html[dir=rtl] .grid,html[dir=rtl] .steps{direction:rtl}</style><title>联系我们 | MOST Petersburg</title><meta name="description" content="告诉我们您的旅行计划"></head><body><header><strong><a href="/zh-CN/">MOST PETERSBURG</a></strong><nav><a href="/zh-CN/">首页</a><a href="/zh-CN/private-tours/index.html">私人定制</a><a href="/zh-CN/events/white-nights-festival/index.html">白夜</a><a href="/zh-CN/events/scarlet-sails/index.html">红帆节</a><a href="/zh-CN/travel-trade.html">旅游同业</a><a href="/zh-CN/contact.html">联系</a></nav></header><main><div class="hero"><div class="eyebrow">MOST Petersburg</div><h1>告诉我们您的旅行计划</h1></div><section><h2>联系我们</h2><p class="note">此表单仅生成可复制的咨询内容，不会发送或保存信息。正式上线前将提供经过验证的联系方式。</p><form id="brief"><div class="formgrid"><div><label for="name">姓名</label><input id="name" required autocomplete="name"></div><div><label for="org">机构（选填）</label><input id="org" autocomplete="organization"></div><div><label for="email">电子邮箱</label><input id="email" type="email" required autocomplete="email"></div><div><label for="type">咨询类型</label><select id="type"><option>旅行社合作</option><option>私人旅行</option><option>目的地营销</option><option>其他</option></select></div></div><div class="formrow"><label for="details">需求详情</label><textarea id="details" required placeholder="出行日期、人数、兴趣、预算及其他信息"></textarea></div><button class="button" type="submit">生成咨询内容</button><p id="feedback" role="status" aria-live="polite"></p><textarea id="draft" readonly hidden aria-label="Prepared enquiry"></textarea></form></section><script>document.getElementById('brief').addEventListener('submit',async function(e){e.preventDefault();if(!this.reportValidity())return;const get=id=>document.getElementById(id).value;const body=['MOST Petersburg - Enquiry','Language: zh-CN','Name: '+get('name'),'Organization: '+get('org'),'Email: '+get('email'),'Type: '+get('type'),'Details: '+get('details')].join('\n');const out=document.getElementById('draft');out.value=body;out.hidden=false;try{await navigator.clipboard.writeText(body);document.getElementById('feedback').textContent="内容已复制；信息尚未发送。"}catch{out.focus();out.select();document.getElementById('feedback').textContent="请复制下方内容；信息尚未发送。"}});</script></main><footer>© 2026 MOST Petersburg · <a href="/privacy.html" hreflang="en">Privacy</a></footer></body></html>
